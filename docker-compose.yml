services:
  postgres:
    image: postgres:16-alpine
    container_name: opsos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsos
      POSTGRES_PASSWORD: opsos_dev_password
      POSTGRES_DB: opsos
    ports:
      - "5432:5432"
    volumes:
      - opsos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsos -d opsos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opsos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - opsos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  opsos_pgdata:
  opsos_redisdata:
